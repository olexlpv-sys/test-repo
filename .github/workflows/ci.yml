name: CI

# CI is deferred until it is physically needed (product owner decision, decisions log Q17): manual runs only.
# Re-enable automatic runs (pull_request / push to main) when PRs and merges to main start.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API build & test
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DocHub.slnx

      - name: Build
        run: dotnet build DocHub.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution DocHub.slnx --configuration Release --no-build --report-xunit-trx --coverage --coverage-output-format cobertura --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  database:
    name: Database build, publish & drift check
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      SA_PASSWORD: CiOnly_Str0ng!Passw0rd
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: CiOnly_Str0ng!Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CiOnly_Str0ng!Passw0rd' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 12 --health-start-period 20s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Generated audit triggers are up to date
        run: |
          dotnet run database/tools/GenerateAuditTriggers.cs
          git status --porcelain database/DocHub.Database src/DocHub.Infrastructure/Audit
          if [ -n "$(git status --porcelain database/DocHub.Database src/DocHub.Infrastructure/Audit)" ]; then
            echo "::error::Generated audit SQL or module hashes differ from the committed files. Run 'dotnet run database/tools/GenerateAuditTriggers.cs' and commit."
            git diff database/DocHub.Database src/DocHub.Infrastructure/Audit
            exit 1
          fi

      - name: Build DACPAC
        run: dotnet build database/DocHub.Database.slnx --configuration Release

      - name: Upload DACPAC
        uses: actions/upload-artifact@v4
        with:
          name: dacpac
          path: database/DocHub.Database/bin/Release/DocHub.Database.dacpac
          if-no-files-found: error

      - name: Publish to SQL Server
        run: >-
          dotnet sqlpackage /Action:Publish /p:IgnoreColumnOrder=True
          /SourceFile:database/DocHub.Database/bin/Release/DocHub.Database.dacpac
          /TargetConnectionString:"Server=localhost,1433;Database=DocHub;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"

      - name: Drift check (a redeploy must contain no DDL)
        run: |
          dotnet sqlpackage /Action:Script /p:IgnoreColumnOrder=True \
            /SourceFile:database/DocHub.Database/bin/Release/DocHub.Database.dacpac \
            /TargetConnectionString:"Server=localhost,1433;Database=DocHub;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True" \
            /OutputPath:redeploy.sql
          # The deploy report can't be used: DacFx lists every ledger table as an empty "Alter" on each redeploy.
          if sed '/^-- <post-deployment>/,$d' redeploy.sql | grep -nEi '^\s*(CREATE|ALTER|DROP)\s|sp_rename'; then
            echo "::error::Database differs from the DACPAC after publishing (drift)."
            exit 1
          fi

  web:
    name: Web lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Generated API client is up to date
        run: npm run gen:api && git diff --exit-code -- src/api/schema.d.ts

      - name: Lint & format
        run: npm run lint && npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

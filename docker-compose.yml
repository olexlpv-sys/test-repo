# Local development dependencies. Usage: cp .env.example .env && docker compose up -d
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dochub-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      MSSQL_PID: Developer
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - dochub-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  azurite:
    # Blob storage for PDF exports (T20); the API's default connection string is UseDevelopmentStorage=true.
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: dochub-azurite
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck --location /data
    ports:
      - "10000:10000"
    volumes:
      - dochub-azurite-data:/data

volumes:
  dochub-sql-data:
  dochub-azurite-data:
